version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - echo Installing dependencies...
      - apt-get update -y
      - apt-get install maven -y

  build:
    commands:
      - echo Building the WAR project...
      - mvn clean package -DskipTests

  post_build:
    commands:
      - echo Build complete.
      - ls target/  # Verify WAR file bana ki nahi
      - mv target/SimpleAWSApp.war app.war  # WAR ko rename karo (optional)

artifacts:
  files:
    - app.war
  discard-paths: yes
