version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - echo Installing dependencies...
      - apt-get update -y
      - apt-get install maven -y

  build:
    commands:
      - echo Building the WAR project...
      - mvn clean package -DskipTests
      - ls target/
      - mv target/SimpleAWSApp.war app.war

  post_build:
    commands:
      - echo Build complete.
      - mkdir -p deploy_bundle/scripts
      - cp app.war deploy_bundle/
      - cp appspec.yml deploy_bundle/
      - cp -r scripts/* deploy_bundle/scripts/
      - echo Files copied to deploy_bundle.

artifacts:
  files:
    - deploy_bundle/**/*
  discard-paths: yes
